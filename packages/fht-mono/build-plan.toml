[buildPlans.FhtMono]
family = "Fht Mono"
spacing = "normal"
serifs = "sans"
noCvSs = true
exportGlyphNames = false

[buildPlans.FhtMono.variants]
inherits = "ss08"

[buildPlans.FhtMono.variants.design]
four = "semi-open-serifless"
five = "upright-arched-serifless"
seven = "straight-serifed"
eight = "two-circles"
nine = "straight-bar"
zero = "slashed"
capital-n = "standard-serifless"
capital-w = "curly-serifless"
capital-x = "straight-serifless"
capital-z = "straight-serifless"
l = "serifed"
t = "bent-hook"
y = "straight-turn-serifless"
z = "straight-serifless"
eszet = "sulzbacher-descending-serifless"
asterisk = "penta-high"
underscore = "above-baseline"
number-sign = "slanted"
ampersand = "closed"
percent = "rings-continuous-slash"
bar = "force-upright"
question = "corner"

[buildPlans.FhtMono.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.FhtMono.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.FhtMono.widths.Normal]
shape = 600
menu = 5
css = "normal"

[buildPlans.FhtMono.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.FhtMono.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"

